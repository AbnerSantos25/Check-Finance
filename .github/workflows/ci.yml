name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Vulnerabilidades nas dependências que vão para o navegador e o Worker.
      # O limite é `high` porque as moderadas atuais vêm do react-router 6, sem
      # correção na v6 (exige >= 7.18, e o vite-react-ssg pede ^6), e não se aplicam
      # aqui: <Link> e navigate() só recebem destinos fixos (legacyHashes.ts) e o
      # deserializeErrors é do SSR com data router, que o site não usa.
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm run test:run
      - run: npm run build

      # Lighthouse mobile nas rotas de lighthouserc.cjs, 3 execuções cada. Reprova o
      # PR se nota ou métrica passar dos limites; o link de cada relatório completo
      # aparece no log deste passo ("Open the report at ...").
      - name: Lighthouse CI
        run: npx --yes @lhci/cli@0.15.1 autorun
