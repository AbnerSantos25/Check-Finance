version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 5
    groups:
      # Minor e patch num PR só por semana; major chega sozinho, para revisar com calma.
      minor-e-patch:
        update-types: [minor, patch]
    ignore:
      # O vite-react-ssg 0.9 exige react-router-dom ^6 (peerDependency).
      - dependency-name: react-router-dom
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: America/Sao_Paulo
    groups:
      actions:
        patterns: ['*']
