<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0d12" />

    <!-- Nenhuma tag de SEO mora aqui: título, description, canonical, robots,
         OpenGraph e Twitter são escritos por rota pelo componente <Seo> e chegam
         ao HTML pelo pré-render. Repetir qualquer uma neste arquivo produziria
         duas cópias na página servida, porque o helmet acrescenta as dele sem
         remover as estáticas. -->

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="sitemap" type="application/xml" title="Sitemap" href="/sitemap.xml" />

    <!-- Identidade do site, igual em todas as rotas. O grafo de cada página
         referencia o #organization daqui em vez de repetir os dados do publisher. -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "WebSite",
          "@id": "https://checkfinance.com.br/#website",
          "url": "https://checkfinance.com.br/",
          "name": "CheckFinance",
          "description": "Hub de ferramentas financeiras gratuitas em português.",
          "inLanguage": "pt-BR",
          "publisher": { "@id": "https://checkfinance.com.br/#organization" }
        },
        {
          "@type": "Organization",
          "@id": "https://checkfinance.com.br/#organization",
          "name": "CheckFinance",
          "url": "https://checkfinance.com.br/",
          "logo": {
            "@type": "ImageObject",
            "url": "https://checkfinance.com.br/og-image.png"
          }
        }
      ]
    }
    </script>

    <!-- Google AdSense -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6087444294118231"
     crossorigin="anonymous"></script>

     <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-3NYMS8KTGJ"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-3NYMS8KTGJ');
    </script>

    <style>
      @keyframes cf-pulse { 0%, 100% { opacity: 1 } 50% { opacity: .45 } }
    </style>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  </head>
  <body class="bg-[#0b0d12] text-slate-100 antialiased selection:bg-emerald-500/30 selection:text-emerald-300">
    <div id="root">
      <!-- Splash de partida, substituído pelo React na primeira renderização.
           Precisa morar no HTML, e não num fallback do roteador: a tela em branco
           começa antes de qualquer código React rodar, enquanto o navegador ainda
           baixa e compila o bundle. Um fallback só apareceria depois disso.
           Estilo inline de propósito — não depende do CSS ter carregado.
           No build, o pré-render substitui este bloco pelo HTML da rota; ele só
           aparece no dev server, sem pré-renderização. -->
      <div style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:#0b0d12">
        <div style="width:48px;height:48px;border-radius:16px;display:flex;align-items:center;justify-content:center;background:linear-gradient(45deg,#059669,#10b981 55%,#99f6e4);animation:cf-pulse 1.6s ease-in-out infinite">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#020617" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M16 7h6v6" /><path d="m22 7-8.5 8.5-5-5L2 17" />
          </svg>
        </div>
        <p style="margin:0;font:500 12px/1.4 system-ui,sans-serif;color:#94a3b8">Carregando o CheckFinance…</p>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
